# Build and publish the prototype to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The app uses hash routing and a relative base, so it works under https://<user>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --cache .npm-ci-cache
      - run: npx tsc -p . && npx vitest run
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
